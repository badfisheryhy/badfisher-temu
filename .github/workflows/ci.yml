name: Java 8 backend verification
on:
  push:
  pull_request:
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'
          cache: maven
      - name: Compile and test without live platform access
        run: mvn -B -ntp clean verify
      - uses: actions/upload-artifact@v4
        with:
          name: badfisher-temu-backend
          path: temu-server/target/badfisher-temu.jar
